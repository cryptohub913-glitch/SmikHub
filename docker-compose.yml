services:
  bot:
    build: .
    command: python -m smikhub.bot.main
    env_file: .env
    environment:
      # Перекрывает DATABASE_URL из .env (даже если там старое значение) — путь должен
      # указывать внутрь примонтированного volume'а, иначе база слетает при каждом
      # пересоздании контейнера (см. docs/integrations.md, раздел "Персистентность БД").
      - DATABASE_URL=sqlite+aiosqlite:////app/data/smikhub.db
    volumes:
      - smikhub-data:/app/data
    restart: unless-stopped

  api:
    build: .
    command: uvicorn smikhub.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/smikhub.db
    ports:
      - "8000:8000"
    volumes:
      - smikhub-data:/app/data
    restart: unless-stopped

  checkbot:
    build: .
    command: python -m smikhub.checkbot.main
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/smikhub.db
    volumes:
      - smikhub-data:/app/data
    restart: unless-stopped

volumes:
  smikhub-data:
