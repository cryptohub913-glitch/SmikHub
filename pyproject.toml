[project]
name = "smikhub"
version = "0.1.0"
description = "SmikHub - Telegram bot marketplace platform (Sell AP module + backend API)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4.0",
    "SQLAlchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "cryptography>=43.0,<44.0",
    "aiohttp>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smikhub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
